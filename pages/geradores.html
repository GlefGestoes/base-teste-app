<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0B1F33">
  <title>Geradores - AMZ App</title>
  <link rel="manifest" href="../manifest.json">
  <link rel="icon" type="image/svg+xml" href="../assets/icons/logoamz.png">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/styles.css">
  <style>
    .card-actions-generator {
      display: flex;
      flex-direction: column;
      gap: var(--space-2);
      margin-top: var(--space-3);
    }
    .card-actions-generator .row-main {
      display: flex;
      gap: var(--space-2);
    }
    .card-actions-generator .row-main .btn { flex: 1; }
    .card-actions-generator .row-controls {
      display: flex;
      gap: var(--space-2);
    }
    .card-actions-generator .row-controls .btn { flex: 1; }
    .btn-control-on[aria-pressed="true"] {
      background: var(--color-success) !important;
      color: #fff !important;
      border-color: var(--color-success) !important;
      box-shadow: 0 0 8px rgba(16,185,129,0.45);
    }
    .btn-control-off[aria-pressed="true"] {
      background: var(--color-error) !important;
      color: #fff !important;
      border-color: var(--color-error) !important;
      box-shadow: 0 0 8px rgba(239,68,68,0.45);
    }
    .btn-control-auto[aria-pressed="true"] {
      background: var(--color-warning) !important;
      color: #fff !important;
      border-color: var(--color-warning) !important;
      box-shadow: 0 0 8px rgba(245,158,11,0.45);
    }
    .generator-location {
      font-size: var(--text-sm);
      color: var(--text-secondary);
      margin: var(--space-2) 0;
      line-height: 1.6;
    }
    .generator-firmware {
      font-size: var(--text-xs);
      color: var(--text-muted);
      margin-bottom: var(--space-2);
    }
    .generator-client-name {
      font-size: var(--text-xs);
      color: var(--text-muted);
      margin-top: var(--space-1);
    }
    #gatewayPanel { margin-bottom: var(--space-4); }
    #generatorsGrid { grid-template-columns: 1fr; }
    @media (min-width: 600px) {
      #generatorsGrid { grid-template-columns: repeat(2,1fr); }
    }
    @media (min-width: 1024px) {
      #generatorsGrid { grid-template-columns: repeat(3,1fr); }
    }
    .generators-empty {
      grid-column: 1 / -1;
      padding: var(--space-8) var(--space-4);
      color: var(--text-muted);
      text-align: center;
      font-size: var(--text-sm);
    }
    /* FIX: alinhar padding do .header com .grid em desktop */
    @media (min-width: 768px) {
      .header {
        padding: var(--space-4) var(--space-8);
      }
    }
  </style>
</head>

<div id="generatorModal" class="modal">

      <h2 id="modalTitle">Novo Gerador</h2>

      </button>

    <div class="modal-body">
      <form id="generatorForm">
        <div class="form-group">
          <label class="form-label">Serial *</label>
          <input type="text" id="genSerial" class="form-input" required>
        </div>
        <div class="form-group">
          <label class="form-label">Module ID *</label>
          <input type="text" id="genModuleId" class="form-input" required>
        </div>
        <div class="form-group">
          <label class="form-label">Cliente *</label>
          <select id="genClient" class="form-select"></select>
        </div>
        <div class="form-group">
          <label class="form-label">Local</label>
          <input type="text" id="genLocal" class="form-input">
        </div>
        <div class="form-grid-3">
          <div class="form-group">
            <label class="form-label">Cidade</label>
            <input type="text" id="genCidade" class="form-input">
          </div>
          <div class="form-group">
            <label class="form-label">UF</label>
            <input type="text" id="genUF" class="form-input" maxlength="2">
          </div>
          <div class="form-group">
            <label class="form-label">CEP</label>
            <input type="text" id="genCEP" class="form-input">
          </div>
        </div>
      </form>
    </div>
    <div class="modal-footer">
      <button id="btnCancel" class="btn btn-secondary">Cancelar</button>
      <button form="generatorForm" class="btn btn-primary">Salvar</button>
    </div>
  </div>
</div>

<script>
(function () {

  if (!AuthService.isAuthenticated()) {
    window.location.href = '../index.html';
    return;
  }
  PermissionsService.guardPage('geradores');
  PermissionsService.applyToDOM();

  const modal       = document.getElementById('generatorModal');
  const form        = document.getElementById('generatorForm');
  const grid        = document.getElementById('generatorsGrid');
  const searchInput = document.getElementById('searchInput');
  let currentIndex  = null;

  const fields = {
    serial:   document.getElementById('genSerial'),
    moduleId: document.getElementById('genModuleId'),
    client:   document.getElementById('genClient'),
    local:    document.getElementById('genLocal'),
    cidade:   document.getElementById('genCidade'),
    uf:       document.getElementById('genUF'),
    cep:      document.getElementById('genCEP'),
  };

  window.clients    = [];
  window.generators = [];

  // --- DSE GATEWAY ---
  const gatewayPanel = document.getElementById('gatewayPanel');
  const statusDot    = document.getElementById('dseStatusDot');
  const statusText   = document.getElementById('dseStatusText');

  function updateStatusBadge(status) {
    statusDot.classList.remove('online', 'offline', 'syncing');
    const classMap = { online:'online', offline:'offline', syncing:'syncing', retrying:'syncing', error:'offline' };
    const cssClass = classMap[status];
    if (cssClass) statusDot.classList.add(cssClass);
    else statusDot.style.background = '#6b7280';
    statusText.textContent = {
      online:'Gateway Online', offline:'Gateway Offline',
      syncing:'Sincronizando…', retrying:'Reconectando…', error:'Erro de conexão',
    }[status] || 'Gateway';
  }

  function onGatewayData(data) {
    gatewayPanel.style.display = 'block';
    document.getElementById('gwSerial').textContent   = data.device?.serial ?? '—';
    document.getElementById('gwIp').textContent       = data.gsm?.ip        ?? '—';
    document.getElementById('gwOperator').textContent = data.gsm?.operator  ?? '—';
    document.getElementById('gwMqtt').textContent     = data.mqtt?.connected ? 'Conectado' : 'Desconectado';
    document.getElementById('gwUpdateTime').textContent =
      'Atualizado: ' + new Date(data.capturedAt).toLocaleTimeString('pt-BR');
    const bars = ['○○○○○','●○○○○','●●○○○','●●●○○','●●●●○','●●●●●'];
    document.getElementById('gwSignal').textContent =
      (bars[data.gsm?.signal] || '—') + ' ' + (data.gsm?.type ?? '');
    document.getElementById('gwGps').textContent = data.gps?.hasFix
      ? `${data.gps.latitude?.toFixed(4)}, ${data.gps.longitude?.toFixed(4)}`
      : 'Sem sinal';
    const moduleMap = {};
    (data.modules ?? []).forEach(m => { if (m.serial) moduleMap[m.serial.toUpperCase()] = m; });
    let changed = false;
    (window.generators ?? []).forEach(g => {
      const mod = moduleMap[g.module_id?.toUpperCase()];
      if (mod) {
        const novoStatus = mod.online ? 'Online' : 'Offline';
        if (g.status !== novoStatus) { g.status = novoStatus; g.firmware = mod.firmware; g.protocol = mod.protocol; changed = true; }
      }
    });
    if (changed) { localStorage.setItem('amz_generators', JSON.stringify(window.generators)); render(window.generators); }
  }

  if (window.CONFIG?.FEATURES?.DSE_INTEGRATION && window.DSEService) {
    window.DSEService.onStatus(updateStatusBadge);
    window.DSEService.onData(onGatewayData);
  }

  // --- CLIENTES ---
  async function loadClientsFromAPI() {
    try {
      const _svc = window.CONFIG?.isDev() ? window.MockService : window.ApiService;
      const response = await _svc.getClients();
      const raw = response?.data ?? response;
      window.clients = Array.isArray(raw) ? raw : [];
      loadClients();
    } catch (err) { console.error('Erro ao carregar clientes:', err); }
  }

  function loadClients() {
    fields.client.innerHTML =
      '<option value="">Selecione</option>' +
      clients.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
  }

  // --- MODAL ---
  function openModal(index = null) {
    form.reset();
    modal.style.display = 'flex';
    currentIndex = index;
    document.getElementById('modalTitle').textContent = index !== null ? 'Editar Gerador' : 'Novo Gerador';
    if (index !== null) {
      const g = generators[index];
      fields.serial.value   = g.serial;
      fields.moduleId.value = g.module_id || '';
      fields.client.value   = g.clientId;
      fields.local.value    = g.local;
      fields.cidade.value   = g.cidade;
      fields.uf.value       = g.uf;
      fields.cep.value      = g.cep;
    }
  }

  function closeModal() { modal.style.display = 'none'; currentIndex = null; }

  // --- SALVAR ---
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    if (!fields.client.value) { alert('Selecione um cliente antes de salvar.'); return; }
    const data = {
      serial: fields.serial.value.trim(), module_id: fields.moduleId.value.trim(),
      client_id: parseInt(fields.client.value, 10) || null,
      local: fields.local.value.trim(), cidade: fields.cidade.value.trim(),
      uf: fields.uf.value.trim(), cep: fields.cep.value.trim(),
      status: 'Aguardando', firmware: '', protocol: '',
    };
    try {
      const _svc = window.CONFIG?.isDev() ? window.MockService : window.ApiService;
      if (currentIndex === null) { await _svc.createGenerator(data); }
      else { const g = generators[currentIndex]; await _svc.updateGenerator(g.id, data); }
    } catch (err) { alert('Erro ao salvar gerador: ' + err.message); return; }
    await loadGeneratorsFromAPI();
    closeModal();
  });

  // --- BUSCA ---
  searchInput.addEventListener('input', (e) => {
    const term = e.target.value.toLowerCase();
    const filtered = generators.filter(g =>
      (g.serial || '').toLowerCase().includes(term) ||
      (g.clientName || '').toLowerCase().includes(term) ||
      (g.local || '').toLowerCase().includes(term)
    );
    render(filtered);
  });

  // --- RENDER ---
  function statusClass(status) {
    return { 'Online':'badge-online', 'Offline':'badge-offline', 'Aguardando':'badge-warning' }[status] || 'badge-warning';
  }

  function render(list) {
    if (list.length === 0) {
      grid.innerHTML = '<p class="generators-empty">Nenhum gerador encontrado. Clique em "+ Novo Gerador" para cadastrar.</p>';
      return;
    }
    grid.innerHTML = list.map((g, index) => `
      <div class="card">
        <div class="card-header">
          <div>
            <div class="card-title">${g.serial} <small style="font-weight:var(--font-normal);font-size:var(--text-sm);color:var(--text-muted);">(${g.module_id || ''})</small></div>
            <div class="generator-client-name">${g.clientName}</div>
          </div>
          <span class="badge ${statusClass(g.status)}">${g.status}</span>
        </div>
        <div class="generator-location">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:middle;margin-right:4px;flex-shrink:0;"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>${g.local || 'Sem local definido'}
          ${g.cidade ? '<br>' + g.cidade + (g.uf ? ' — ' + g.uf : '') : ''}
        </div>
        ${g.firmware ? `<div class="generator-firmware">Firmware: ${g.firmware} &nbsp;|&nbsp; ${g.protocol}</div>` : ''}
        <div class="card-actions-generator">
          <div class="row-main">
            <button class="btn btn-secondary" onclick="editGenerator(${index})" data-permission="gen_editar">Editar</button>
            <button class="btn btn-danger" onclick="handleDeleteGenerator(${index})" data-permission="gen_excluir">Excluir</button>
          </div>
          <div class="row-controls">
            <button class="btn btn-secondary btn-control-on" data-gen-btn="on" data-permission="gen_ligar" data-gen-id="${g.id}" aria-pressed="false" title="Ligar ${g.serial}">Ligar</button>
            <button class="btn btn-secondary btn-control-off" data-gen-btn="off" data-permission="gen_desligar" data-gen-id="${g.id}" aria-pressed="false" title="Desligar ${g.serial}">Desligar</button>
            <button class="btn btn-secondary btn-control-auto" data-gen-btn="auto" data-permission="gen_auto" data-gen-id="${g.id}" aria-pressed="false" title="Modo Automático — ${g.serial}">Aut</button>
          </div>
        </div>
      </div>
    `).join('');

    if (window.GeneratorControlsService) {
      window.GeneratorControlsService.bindAll(list);
    }

    // ── Realtime DSE→PWA: atualiza botões quando DSE muda de estado ──────
    if (window.GeneratorReadingsService && !window._geradoresRealtimeInit) {
      window._geradoresRealtimeInit = true;
      window.GeneratorReadingsService.subscribeRealtime((record) => {
        // Quando chega leitura de velocidade_motor, sincroniza botões
        if (record?.velocidade_motor !== undefined && record?.velocidade_motor !== null) {
          const moduleId = record.module_id || record.moduleId || null;
          if (moduleId && window.GeneratorControlsService) {
            window.GeneratorControlsService.syncFromModuleId(moduleId, record.velocidade_motor);
          }
        }
      });
    }
  }

  // --- AÇÕES GLOBAIS ---
  window.editGenerator = (index) => openModal(index);
  window.handleDeleteGenerator = async (index) => {
    const g = generators[index];
    if (confirm(`Tem certeza que deseja excluir o gerador ${g.serial}?`)) {
      try {
        const _svc = window.CONFIG?.isDev() ? window.MockService : window.ApiService;
        await _svc.deleteGenerator(g.id);
        await loadGeneratorsFromAPI();
      } catch (err) { alert('Erro ao excluir gerador: ' + err.message); }
    }
  };

  document.getElementById('btnNovo').onclick    = () => openModal();
  document.getElementById('closeModal').onclick = closeModal;
  document.getElementById('btnCancel').onclick  = closeModal;

  document.getElementById('menuToggleNavbar').onclick = () => {
    document.getElementById('sidebar').classList.toggle('open');
    document.getElementById('sidebarOverlay').classList.toggle('open');
  };
  document.getElementById('sidebarOverlay').onclick = () => {
    document.getElementById('sidebar').classList.remove('open');
    document.getElementById('sidebarOverlay').classList.remove('open');
  };

  // --- CARREGAR GERADORES ---
  async function loadGeneratorsFromAPI() {
    try {
      const _svc = window.CONFIG?.isDev() ? window.MockService : window.ApiService;
      const response = await _svc.getGenerators();
      const data = response?.data ?? response;
      window.generators = (Array.isArray(data) ? data : []).map(g => ({
        ...g,
        clientName: g.clients?.name || 'Sem cliente',
        clientId: g.client_id || (g.clients ? g.clients.id : null),
      }));
      if (window.CONFIG?.FEATURES?.DSE_INTEGRATION && window.DSEService) {
        const firstWithSerial = window.generators.find(g => g.serial?.trim());
        if (firstWithSerial) {
          const gen = { id: firstWithSerial.id, serial: firstWithSerial.serial, moduleId: firstWithSerial.module_id || '' };
          if (window.CONFIG?.DSE?.AUTO_POLL) {
            window.DSEService.startPolling(gen, window.CONFIG?.DSE?.POLL_INTERVAL || 10000);
          } else {
            window.DSEService.setGenerator(gen);
          }
        }
      }
      render(window.generators);
    } catch (err) { console.error('Erro ao carregar geradores:', err); render([]); }
  }

  // --- LIMPEZA ---
  window.addEventListener('beforeunload', () => {
    if (window.DSEService)               window.DSEService.destroy();
    if (window.GeneratorControlsService) window.GeneratorControlsService.destroy();
    if (window.GeneratorReadingsService)  window.GeneratorReadingsService.unsubscribeRealtime();
    window._geradoresRealtimeInit = false;
  });

  // --- INIT ---
  async function init() {
    try {
      await loadClientsFromAPI();
      await loadGeneratorsFromAPI();
      console.log('Página de geradores inicializada.');
    } catch (err) { console.error('Erro na inicialização:', err); }
  }

  init();

})();
</script>

</body>
</html>

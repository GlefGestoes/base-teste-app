  <!-- ══ MAIN ══════════════════════════════════════════════════════════════ -->
  <main class="main-content">

    <!-- Header — idêntico à v1 -->
    <header class="page-header">
      <h1 class="page-title">Monitoramento</h1>
      <p class="page-subtitle">Acompanhamento em tempo real</p>
    </header>

    <div style="padding: 0 var(--space-4);">

      <!-- Filtros -->
      <div style="display: flex; gap: var(--space-3); margin-bottom: var(--space-4); flex-wrap: wrap;">
        <select id="filterStatus" class="form-select" style="min-width: 150px;">
          <option value="">Todos os status</option>
          <option value="Online">Online</option>
          <option value="Offline">Offline</option>
          <option value="Aguardando">Aguardando</option>
        </select>
        <select id="filterClient" class="form-select" style="min-width: 150px;">
          <option value="">Todos os clientes</option>
        </select>
      </div>

      <!-- Painel Gateway DSE -->
      <div id="gatewayPanel" style="display: none; margin-bottom: var(--space-4);">
        <div class="card" style="border-left: 3px solid var(--color-accent);">
          <div class="card-header">
            <div class="card-title">Gateway DSE — <span id="gwSerial">—</span></div>
            <span id="gwUpdateTime" style="font-size: var(--text-xs); color: var(--text-muted);"></span>
          </div>
          <div style="display: flex; flex-wrap: wrap; gap: var(--space-4); font-size: var(--text-sm);">
            <div><strong id="gwSignal">—</strong> (<span id="gwOperator">—</span>)</div>
            <div>IP: <strong id="gwIp">—</strong></div>
            <div>MQTT: <strong id="gwMqtt">—</strong></div>
            <div>GPS: <strong id="gwGps">—</strong></div>
          </div>
        </div>
      </div>

      <!-- Grid de Geradores + Painel de Instrumentos por gerador -->
      <!-- Cada gerador renderizado pelo JS já inclui seu próprio painel de instrumentos abaixo -->
      <div id="generatorsGrid">
        <!-- preenchido via JS — cada item inclui card do gerador + instrumentos -->
      </div>

      <!-- Painéis legados (mantidos para compatibilidade com realtime) — ocultos visualmente -->
      <div style="display:none;">
        <span id="monitorStatusDot"></span>
        <span id="monitorStatusText"></span>
        <div id="motorGrid"></div>
        <div id="geradorGrid"></div>
        <div id="redeGrid"></div>
        <div id="historicoVelocidade"></div>
        <span id="historicoCount"></span>
      </div>

    </div>
  </main>

  <!-- Scripts — versão atual, todos preservados -->
  <script src="../config.js"></script>
  <script src="../js/utils/helpers.js"></script>
  <script src="../js/services/mock.service.js"></script>
  <script src="../js/services/api.service.js"></script>
  <script src="../js/services/auth.service.js"></script>
  <script src="../js/services/permissions.service.js"></script>
  <script src="../js/services/dse.service.js"></script>
  <script src="../js/services/generator-readings.service.js"></script>
  <script src="../js/app.js"></script>

  <script>
  let _realtimeInitialized = false;
  let _debounceTimerMonit  = null;
  const _ultimosValores    = {};
  let _latestDash          = {};  // escopo global — compartilhado entre IIFE e funções externas

  // Campos das Leituras em Tempo Real (escopo global para uso no IIFE e em loadMonitoramentoReadings)
  const _rtCampos = [
    { campo: 'velocidade_motor',         icon: 'velocidade', label: 'Velocidade Motor',     unidade: 'RPM' },
    { campo: 'pressao_oleo',             icon: 'pressao',    label: 'Pressão do Óleo',      unidade: 'bar' },
    { campo: 'temperatura_resfriamento', icon: 'thermo',     label: 'Temp. Resfriamento',   unidade: '°C'  },
    { campo: 'nivel_combustivel',        icon: 'fuel',       label: 'Nível de Combustível', unidade: '%'   },
    { campo: 'tensao_bateria',           icon: 'bateria',    label: 'Tensão da Bateria',    unidade: 'V'   },
    { campo: 'frequencia_gerador',       icon: 'frequencia', label: 'Frequência Gerador',   unidade: 'Hz'  },
    { campo: 'gerador_tensao_l1n',       icon: 'tensao',     label: 'Gerador Tensão L1-N',  unidade: 'V'   },
    { campo: 'gerador_watts_total',      icon: 'potencia',   label: 'Potência Total',       unidade: 'W'   },
  ];

  function _debounceReloadMonit() {
    clearTimeout(_debounceTimerMonit);
    _debounceTimerMonit = setTimeout(() => loadMonitoramentoReadings(), 200);
  }

  // ── Ícones SVG (padrão v1) ───────────────────────────────────────────────
  function getIcon(name) {
    const icons = {
      fuel:       '<path d="M3 22h12V4a1 1 0 0 0-1-1H4a1 1 0 0 0-1 1v18z"></path><path d="M15 8h2a2 2 0 0 1 2 2v3a1 1 0 0 0 1 1h1v5a1 1 0 0 1-1 1h-1"></path><line x1="7" y1="22" x2="7" y2="11"></line><line x1="3" y1="11" x2="15" y2="11"></line>',
      velocidade: '<circle cx="12" cy="12" r="10"></circle><path d="M12 8v4l3 3"></path><path d="M7.5 7.5l1.5 1.5M16.5 7.5l-1.5 1.5M6 12h2M16 12h2"></path>',
      pressao:    '<path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"></path>',
      thermo:     '<path d="M14 14.76V3.5a2.5 2.5 0 0 0-5 0v11.26a4.5 4.5 0 1 0 5 0z"></path>',
      bateria:    '<rect x="2" y="7" width="16" height="10" rx="2" ry="2"></rect><line x1="22" y1="11" x2="22" y2="13"></line><line x1="10" y1="10" x2="10" y2="14"></line>',
      frequencia: '<path d="M2 12h3l3-8 4 16 3-8h3"></path>',
      tensao:     '<path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"></path>',
      potencia:   '<path d="M18.36 6.64a9 9 0 1 1-12.73 0"></path><line x1="12" y1="2" x2="12" y2="12"></line>',
      zap:        '<polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>',
      alert:      '<path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line>',
      users:      '<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path>',
      tool:       '<path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"></path>',
      wifi:       '<path d="M1.42 9a16 16 0 0 1 21.16 0M5 12.55a11 11 0 0 1 14.08 0M10.5 16.05a5 5 0 0 1 3 0M12 20h.01"></path>',
      terminal:   '<path d="M1 6l5 6-5 6M8 6h13M8 12h13M8 18h13"></path>',
      'x-circle': '<circle cx="12" cy="12" r="10"></circle><line x1="15" y1="9" x2="9" y2="15"></line><line x1="9" y1="9" x2="15" y2="15"></line>',
      info:       '<circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line>',
      check:      '<path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline>',
      activity:   '<polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline>',
    };
    return icons[name] || icons.activity;
  }

  (function() {
    if (!AuthService.isAuthenticated()) { window.location.href = '../index.html'; return; }

    document.getElementById('menuToggle').addEventListener('click', () => {
      document.getElementById('sidebar').classList.toggle('open');
      document.getElementById('sidebarOverlay').classList.toggle('open');
    });
    document.getElementById('sidebarOverlay').addEventListener('click', () => {
      document.getElementById('sidebar').classList.remove('open');
      document.getElementById('sidebarOverlay').classList.remove('open');
    });

    let allGenerators = [];
    let dseData       = null;

    // ── DSE Status Badge ─────────────────────────────────────────────────
    const STATUS_COLOR = { online:'#10b981', offline:'#ef4444', syncing:'#f59e0b', error:'#ef4444' };
    function updateStatusBadge(status) {
      document.getElementById('dseStatusDot').style.background = STATUS_COLOR[status] || '#6b7280';
      document.getElementById('dseStatusText').textContent = { online:'Gateway Online', offline:'Gateway Offline', syncing:'Sincronizando…', error:'Erro de conexão' }[status] || 'Gateway';
    }

    // ── Gateway Panel ────────────────────────────────────────────────────
    function updateGatewayPanel(data) {
      dseData = data;
      document.getElementById('gatewayPanel').style.display = 'block';
      document.getElementById('gwSerial').textContent    = data.device?.serial ?? '—';
      document.getElementById('gwIp').textContent        = data.gsm?.ip        ?? '—';
      document.getElementById('gwOperator').textContent  = data.gsm?.operator  ?? '—';
      document.getElementById('gwMqtt').textContent      = data.mqtt?.connected ? 'Conectado' : 'Desconectado';
      document.getElementById('gwUpdateTime').textContent= 'Atualizado: ' + new Date(data.capturedAt).toLocaleTimeString('pt-BR');
      const bars = ['○○○○○','●○○○○','●●○○○','●●●○○','●●●●○','●●●●●'];
      document.getElementById('gwSignal').textContent = (bars[data.gsm?.signal] || '—') + ' ' + (data.gsm?.type ?? '');
      document.getElementById('gwGps').textContent   = data.gps?.hasFix ? `${data.gps.latitude?.toFixed(4)}, ${data.gps.longitude?.toFixed(4)}` : 'Sem sinal';

      const moduleMap = {};
      (data.modules ?? []).forEach(m => { if (m.serial) moduleMap[m.serial.toUpperCase()] = m; });
      allGenerators.forEach(g => {
        const mod = moduleMap[g.module_id?.toUpperCase()];
        if (mod) { g.status = mod.online ? 'Online' : 'Offline'; g.firmware = mod.firmware || g.firmware; }
      });
      renderGenerators(applyFilters(), _latestDash);
    }

    // ── Filtros ──────────────────────────────────────────────────────────
    function applyFilters() {
    document.getElementById('filterStatus').addEventListener('change', () => renderGenerators(applyFilters(), _latestDash));
    document.getElementById('filterClient').addEventListener('change', () => renderGenerators(applyFilters(), _latestDash));

    // ── Badge helper
    function statusClass(s) {
      return s === 'Online' ? 'badge-online' : s === 'Offline' ? 'badge-offline' : 'badge-warning';
    }

    // ── Render RT cards inline (sem await) usando dash já disponível ───────
    function renderRtGrid(gId, dash) {
      const svc  = window.GeneratorReadingsService;
      const grid = document.getElementById(`rtGrid-${gId}`);
      const tsEl = document.getElementById(`rtTimestamp-${gId}`);
      if (!svc || !grid || !dash) return;
      grid.innerHTML = _rtCampos.map(({ campo, icon, label, unidade }) => {
        const cfg    = svc.CAMPOS[campo] || { decimais: 1 };
        const dado   = dash[campo];
        const valor  = dado?.valor ?? null;
        const stale  = dado?.stale ?? false;
        const ageMin = dado?.ageMin ?? null;
        const alerta = svc.getAlerta(campo, valor);
        const cor    = stale ? '#d97706' : alerta === 'critico' ? '#ef4444' : alerta === 'atencao' ? '#f59e0b' : 'var(--color-accent)';
        const staleTag = stale && ageMin !== null
          ? `<span style="font-size:9px;background:#d97706;color:#fff;border-radius:3px;padding:0 3px;margin-left:3px;">⏱${ageMin>=60?Math.round(ageMin/60)+'h':ageMin+'m'}</span>`
          : '';
        const valTxt = valor !== null ? svc.formatarValor(valor, '', cfg.decimais) : '—';
        return `
          <div class="card rt-card" data-campo="${campo}" data-gen="${gId}"
            style="padding: var(--space-2) var(--space-3); border-left: 3px solid ${cor}; display: flex; align-items: center; gap: var(--space-2); min-height: 60px; ${stale ? 'opacity:.85;' : ''}">
            <div style="flex-shrink: 0; width: 32px; height: 32px; border-radius: var(--radius-lg); background: var(--bg-input); display: flex; align-items: center; justify-content: center; color: ${cor};">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">${getIcon(icon)}</svg>
            </div>
            <div style="min-width: 0; flex: 1;">
              <div style="font-size: 10px; color: var(--text-muted); display: flex; align-items: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">${label}${staleTag}</div>
              <div class="rt-valor" style="font-size: var(--text-base); font-weight: var(--font-semibold); color: ${cor}; line-height: 1.2;">${valTxt}</div>
              <div style="font-size: 10px; color: var(--text-muted); white-space: nowrap;">${unidade}</div>
            </div>
          </div>`;
      }).join('');
      if (tsEl) tsEl.textContent = 'Atualizado: ' + new Date().toLocaleTimeString('pt-BR');
    }

    // ── Cards de Geradores — EXATO layout v1 com dados DSE reais ─────────
    function renderGenerators(list, dash) {
      // Usa dash passado ou _latestDash como fallback
      const d = dash || _latestDash || {};
      const container = document.getElementById('generatorsGrid');
      if (!list.length) {
        container.innerHTML = '<p style="color: var(--text-muted); padding: 20px;">Nenhum gerador encontrado.</p>';
        return;
      }

      container.innerHTML = list.map((g, idx) => {
        const mod       = dseData?.modules?.find(m => m.serial?.toUpperCase() === g.module_id?.toUpperCase());
        const temp      = d.temperatura_resfriamento?.valor ?? null;
        const fuel      = d.nivel_combustivel?.valor ?? null;
        const watts     = d.gerador_watts_total?.valor ?? null;
        const tempColor = temp === null ? 'success' : temp > 90 ? 'error' : temp > 80 ? 'warning' : 'success';
        const fuelPct   = fuel !== null ? Math.min(100, Math.max(0, fuel)) : null;
        const fuelColor = fuelPct === null ? '#3b82f6' : fuelPct < 10 ? 'var(--color-error)' : fuelPct < 30 ? 'var(--color-warning)' : fuelPct < 60 ? '#3b82f6' : 'var(--color-success)';
        const badgeClass = statusClass(g.status);
        const gId = `mon-gen-${idx}`;

        return `
          <div class="card" style="margin-bottom: var(--space-4);">

            <!-- Identificação -->

    // ── Leituras em Tempo Real (8 campos prioritários) ────────────────────
    // ── Instrumentos DSE por gerador ──────────────────────────────────────
    async function loadInstrumentosMonitor(g, gId, dashPrefetch) {
      const svc = window.GeneratorReadingsService;
      if (!svc) return;

      const grupos = {
        motor:   ['velocidade_motor','pressao_oleo','temperatura_resfriamento','temperatura_oleo','nivel_combustivel','tensao_bateria','tensao_carga_alternador','tempo_funcionamento_motor'],
        gerador: ['frequencia_gerador','gerador_tensao_l1n','gerador_tensao_l2n','gerador_tensao_l3n','gerador_corrente_l1','gerador_corrente_l2','gerador_corrente_l3','gerador_watts_total'],
        rede:    ['frequencia_rede','rede_tensao_l1n','rede_tensao_l2n','rede_tensao_l3n'],
      };

      try {
        // Usa dash pré-carregado se disponível — evita chamada extra ao servidor
        const dash = dashPrefetch || await svc.getDashboard();
        const todos = [...grupos.motor, ...grupos.gerador, ...grupos.rede];
        const mapa  = {};
        todos.forEach(c => {
          const d = dash[c];
          mapa[c] = d && d.valor !== null ? { [c]: d.valor, reading_timestamp: d.timestamp, stale: d.stale, ageMin: d.ageMin } : null;
        });

        // Status velocidade
        const velDado = mapa['velocidade_motor'];
        const vel     = velDado ? parseFloat(velDado.velocidade_motor) : null;
        const velStale= velDado?.stale ?? false;
        const online  = vel !== null && vel > 0 && !velStale;
        const dot  = document.getElementById(`monStatusDot-${gId}`);
        const txt  = document.getElementById(`monStatusText-${gId}`);
        if (dot) dot.style.background = online ? '#10b981' : velStale ? '#f59e0b' : '#6b7280';
        if (txt) txt.textContent = velDado
          ? (velStale ? `Dado antigo (${velDado.ageMin}min) · ${vel} RPM`
             : online ? `Online · ${vel} RPM · ${svc.formatarTimestamp(velDado.reading_timestamp)}`
                      : `Parado · ${svc.formatarTimestamp(velDado.reading_timestamp)}`)
          : 'Sem dados';

        // Renderizar grupos
        ['motor','gerador','rede'].forEach(grupo => {
          const el = document.getElementById(`${grupo}Grid-${gId}`);
          if (!el) return;
          el.innerHTML = grupos[grupo].map(campo => {
            const cfg    = svc.CAMPOS[campo];
            const dado   = mapa[campo];
            const valor  = dado ? parseFloat(dado[campo]) : null;
            const stale  = dado?.stale ?? false;
            const ageMin = dado?.ageMin ?? null;
            const alerta = svc.getAlerta(campo, valor);
            const cor    = stale ? '#d97706' : alerta === 'critico' ? '#ef4444' : alerta === 'atencao' ? '#f59e0b' : '#10b981';
            const staleLabel = stale && ageMin !== null
              ? `<span style="font-size:9px;background:#d97706;color:#fff;border-radius:3px;padding:0 4px;margin-left:3px;">⏱ ${ageMin>=60?Math.round(ageMin/60)+'h':ageMin+'min'}</span>`
              : '';
            return `
              <div class="card" data-campo="${campo}" data-gen="${gId}" style="padding:var(--space-3);border-left:2px solid ${cor};${stale?'opacity:.85;':''}">
                <div style="font-size:var(--text-xs);color:var(--text-muted);display:flex;align-items:center;gap:3px;">${cfg.label}${staleLabel}</div>
                <div class="card-valor" style="font-size:var(--text-xl);font-weight:var(--font-semibold);color:${cor};margin:var(--space-1) 0;">${svc.formatarValor(valor,cfg.unidade,cfg.decimais)}</div>
                <div class="card-ts" style="font-size:var(--text-xs);color:var(--text-muted);">${dado?svc.formatarTimestamp(dado.reading_timestamp):'—'}</div>
              </div>`;
          }).join('');
        });

        // Histórico
        const historico = await svc.getHistorico('velocidade_motor', 2, 30);
        const histEl    = document.getElementById(`histVel-${gId}`);
        const histCount = document.getElementById(`histCount-${gId}`);
        if (histEl && historico.length) {
          if (histCount) histCount.textContent = `${historico.length} leituras`;
          histEl.innerHTML = historico.map(r => {
            const v   = parseFloat(r.velocidade_motor);
            const cor = v > 0 ? '#10b981' : '#6b7280';
            const t   = new Date(r.reading_timestamp).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
            return `<span style="display:inline-block;margin-right:var(--space-3);color:${cor};">${t}: <strong>${v}</strong> RPM</span>`;
          }).join('');
        } else if (histEl) {
          histEl.textContent = 'Sem leituras nas últimas 2h.';
        }

      } catch(err) {
        console.error(`[Monitoramento] Instrumentos ${gId}:`, err);
      }
    }

    // ── Carregar geradores ────────────────────────────────────────────────
    async function loadGenerators() {
      try {
        const apiSvc = window.CONFIG?.isDev() ? window.MockService : window.ApiService;
        const rdSvc  = window.GeneratorReadingsService;

        // Busca geradores e leituras em paralelo — sem esperar um pelo outro
        const [genRes, dashRes] = await Promise.allSettled([
          apiSvc.getGenerators(),
          rdSvc ? rdSvc.getDashboard() : Promise.resolve(null),
        ]);

        const raw = genRes.status === 'fulfilled' ? (genRes.value?.data ?? genRes.value) : [];
        allGenerators = (Array.isArray(raw) ? raw : []).map(g => ({ ...g, clientName: g.clients?.name || 'Sem cliente' }));

        // Popula _latestDash ANTES de renderizar — cards exibem dados imediatamente
        if (dashRes.status === 'fulfilled' && dashRes.value) {
          _latestDash = dashRes.value;
        }

        const clients = [...new Map(allGenerators.map(g => [g.client_id, g.clientName])).entries()];
        const selCli  = document.getElementById('filterClient');
        if (selCli) selCli.innerHTML = '<option value="">Todos os clientes</option>' +
          clients.filter(([id]) => id).map(([id, name]) => `<option value="${id}">${name}</option>`).join('');

        // Renderiza com dados já disponíveis — sem segunda espera
        renderGenerators(applyFilters(), _latestDash);

        if (window.CONFIG?.FEATURES?.DSE_INTEGRATION && window.DSEService) {
          const first = allGenerators.find(g => g.serial?.trim());
          if (first) {
            const gen = { id: first.id, serial: first.serial, moduleId: first.module_id || '' };
            window.CONFIG?.DSE?.AUTO_POLL
              ? window.DSEService.startPolling(gen, window.CONFIG?.DSE?.POLL_INTERVAL || 10000)
              : window.DSEService.setGenerator(gen);
          }
        }
      } catch(err) {
        console.error('[Monitoramento] Erro:', err);
        const g = document.getElementById('generatorsGrid');
        if (g) g.innerHTML = '<p style="color: var(--text-muted); padding: 20px;">Erro ao carregar geradores.</p>';
      }
    }

    // ── DSE Integration ───────────────────────────────────────────────────
    if (window.CONFIG?.FEATURES?.DSE_INTEGRATION && window.DSEService) {
      window.DSEService.onStatus(updateStatusBadge);
      window.DSEService.onData(updateGatewayPanel);
    }

    window.addEventListener('beforeunload', () => {
      clearTimeout(_debounceTimerMonit);
      if (window.DSEService) window.DSEService.destroy();
      if (window.GeneratorReadingsService?.unsubscribeRealtime) window.GeneratorReadingsService.unsubscribeRealtime();
    });

    loadGenerators();
    iniciarRealtime();
  })();

  // ── Realtime ─────────────────────────────────────────────────────────────
  function iniciarRealtime() {
    if (_realtimeInitialized) return;
    const svc = window.GeneratorReadingsService;
    if (!svc) return;
    if (typeof svc.unsubscribeRealtime === 'function' && svc._ws) svc.unsubscribeRealtime();
    if (typeof svc.subscribeRealtime === 'function') {
      svc.subscribeRealtime(record => { atualizarCardDireto(record); _debounceReloadMonit(); });
    }
    _realtimeInitialized = true;
  }

  function atualizarCardDireto(record) {
    const svc = window.GeneratorReadingsService;
    if (!svc || !record) return;
    const todosCampos = [
      'velocidade_motor','pressao_oleo','temperatura_resfriamento','temperatura_oleo',
      'nivel_combustivel','tensao_bateria','tensao_carga_alternador','tempo_funcionamento_motor',
      'frequencia_gerador','gerador_tensao_l1n','gerador_tensao_l2n','gerador_tensao_l3n',
      'gerador_corrente_l1','gerador_corrente_l2','gerador_corrente_l3','gerador_watts_total',
      'frequencia_rede','rede_tensao_l1n','rede_tensao_l2n','rede_tensao_l3n',
    ];
    let atualizado = null;
    for (const c of todosCampos) {
      if (record[c] !== null && record[c] !== undefined) {
        _ultimosValores[c] = { valor: record[c], timestamp: record.reading_timestamp };
        atualizado = c; break;
      }
    }
    if (!atualizado) return;
    // Atualiza cards DSE (instrumentos detalhados)
    const cardEl = document.querySelector(`[data-campo="${atualizado}"]:not(.rt-card)`);
    if (cardEl) {
      const cfg    = svc.CAMPOS[atualizado];
      const valor  = parseFloat(record[atualizado]);
      const alerta = svc.getAlerta(atualizado, valor);
      const cor    = alerta === 'critico' ? '#ef4444' : alerta === 'atencao' ? '#f59e0b' : '#10b981';
      const elV    = cardEl.querySelector('.card-valor');
      const elT    = cardEl.querySelector('.card-ts');
      cardEl.style.borderLeftColor = cor;
      if (elV) { elV.style.color = cor; elV.textContent = svc.formatarValor(valor, cfg.unidade, cfg.decimais); }
      if (elT) elT.textContent = svc.formatarTimestamp(record.reading_timestamp);
      cardEl.classList.remove('card-pulse'); void cardEl.offsetWidth; cardEl.classList.add('card-pulse');
    }
    // Atualiza cards Leituras Realtime
    const rtCards = document.querySelectorAll(`.rt-card[data-campo="${atualizado}"]`);
    rtCards.forEach(rtCard => {
      const cfg    = svc.CAMPOS[atualizado];
      const valor  = parseFloat(record[atualizado]);
      const alerta = svc.getAlerta(atualizado, valor);
      const cor    = alerta === 'critico' ? '#ef4444' : alerta === 'atencao' ? '#f59e0b' : 'var(--color-accent)';
      const elV    = rtCard.querySelector('.rt-valor');
      rtCard.style.borderLeftColor = cor;
      if (elV) { elV.style.color = cor; elV.textContent = svc.formatarValor(valor, '', cfg.decimais); }
      const gId    = rtCard.dataset.gen;
      const tsEl   = gId ? document.getElementById(`rtTimestamp-${gId}`) : null;
      if (tsEl) tsEl.textContent = 'Atualizado: ' + new Date().toLocaleTimeString('pt-BR');
      rtCard.classList.remove('card-pulse'); void rtCard.offsetWidth; rtCard.classList.add('card-pulse');
    });
    if (atualizado === 'velocidade_motor') {
      const vel  = parseFloat(record.velocidade_motor);
      const on   = vel > 0;
      const dot  = document.getElementById('monitorStatusDot');
      const txt  = document.getElementById('monitorStatusText');
      if (dot) dot.style.background = on ? '#10b981' : '#ef4444';
      if (txt) txt.textContent = on
        ? `Online · ${vel} RPM · ${svc.formatarTimestamp(record.reading_timestamp)}`
        : `Parado · ${svc.formatarTimestamp(record.reading_timestamp)}`;

      const histEl    = document.getElementById('historicoVelocidade');
      const histCount = document.getElementById('historicoCount');
      if (histEl) {
        const t   = new Date(record.reading_timestamp).toLocaleTimeString('pt-BR', { hour:'2-digit', minute:'2-digit', second:'2-digit' });
        const cor = vel > 0 ? '#10b981' : '#6b7280';
        const sp  = document.createElement('span');
        sp.style.cssText = `display:inline-block;margin-right:var(--space-3);color:${cor};`;
        sp.innerHTML = `${t}: <strong>${vel}</strong> RPM`;
        histEl.appendChild(sp);
        histEl.scrollLeft = histEl.scrollWidth;
        if (histCount) histCount.textContent = `${(parseInt(histCount.textContent)||0)+1} leituras`;
      }
    }
  }

    renderGrupo('motorGrid',   grupos.motor);
    renderGrupo('geradorGrid', grupos.gerador);

    // Atualiza grids de Leituras Realtime de todos os geradores visíveis com dash fresco
    document.querySelectorAll('[id^="rtGrid-"]').forEach(el => {

    const historico = await svc.getHistorico('velocidade_motor', 2, 30);

    if (histEl && historico.length) {
      if (histCount) histCount.textContent = `${historico.length} leituras`;
      histEl.innerHTML = historico.map(r => {
        const v   = parseFloat(r.velocidade_motor);
        const cor = v > 0 ? '#10b981' : '#6b7280';
        const t   = new Date(r.reading_timestamp).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
        return `<span style="display:inline-block;margin-right:var(--space-3);color:${cor};">${t}: <strong>${v}</strong> RPM</span>`;
      }).join('');
    } else if (histEl) {
      histEl.textContent = 'Sem leituras nas últimas 2 horas.';
    }
  }

  const _monitorFallback = setInterval(loadMonitoramentoReadings, 30000);
  window.addEventListener('beforeunload', () => clearInterval(_monitorFallback), { once: true });
  </script>

</body>
</html>
